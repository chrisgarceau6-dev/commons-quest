name: Build, test & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by refresh-menus.yml after it commits a fresh menu.json, because a
  # push made with GITHUB_TOKEN does not itself trigger this workflow.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Smoke-test the app bundle
        run: python scripts/smoke_test.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Upload gq-app as the site root
        uses: actions/upload-pages-artifact@v3
        with:
          path: gq-app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
