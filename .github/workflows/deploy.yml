name: Build, test & deploy

# Runs on every push, and every night to pull fresh dining-hall menus.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 8 * * *"      # 3:17am Eastern (4:17 during daylight time)
  workflow_dispatch:

permissions:
  contents: write   # commit refreshed menus
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh menus and hours
        if: github.event_name != 'push'
        run: |
          python3 scripts/scrape_menu.py data/menu.json data/menu.json "$(TZ=America/New_York date +%m/%d/%Y)" --hours data/hours.json
          if ! git diff --quiet -- data/; then
            git config user.name "commons-quest-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ && git commit -m "data: menus for $(TZ=America/New_York date +%Y-%m-%d)" && git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests (meal parser)
        run: node --test tests/smartlog.test.js

      - name: End-to-end test (real app in a headless phone browser)
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          node tests/e2e.mjs

      - name: Package site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js src assets data _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
