<meta charset="utf-8">
<title>Gainz Quest</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#241a4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gainz Quest">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:Rubik;font-weight:600;font-display:swap;src:url(fonts/rubik-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Rubik;font-weight:700;font-display:swap;src:url(fonts/rubik-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Rubik;font-weight:800;font-display:swap;src:url(fonts/rubik-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:P2P;font-display:swap;src:url(fonts/press-start-2p-latin-400-normal.woff2) format("woff2")}
/* Layout: one phone-width column; HUD on top, a screen in the middle, game nav fixed at the bottom. Deliberately single-theme (night arcade). */
:root{
  --ink:#120c2b; --night:#241a4d; --night2:#1c1440; --dot:#3a2d75; --panel:#fff4d6; --panel2:#f3e6c4; --purple:#3e2f80;
  --gold:#ffcc3d; --red:#c2273a; --hp:#ff4f5e; --pwr:#3ec7ff; --sug:#ff6fd8; --na:#ff9a3c; --green:#5be36b; --muted:#b7a8f0; --dim:#6b5a8c;
  --pix:Rubik,ui-sans-serif,system-ui,sans-serif; --arcade:P2P,ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--night)}
body{margin:0;color:#fff;font-family:var(--pix);font-weight:600;font-variant-numeric:tabular-nums;font-size:15px;background-color:var(--night);background-image:radial-gradient(var(--dot) 1.5px,transparent 1.6px);background-size:18px 18px;-webkit-tap-highlight-color:transparent}
button{font-family:var(--pix);cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:460px;margin:0 auto;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.gut{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.arc{font-family:var(--arcade)}
.panel{border:4px solid var(--ink);border-radius:10px;background:var(--panel);color:#2b1d3a;box-shadow:0 5px 0 var(--ink),inset 0 3px 0 #fff}
.btn{border:3px solid var(--ink);border-radius:7px;font-weight:700;box-shadow:0 4px 0 var(--ink),inset 0 -4px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.45);transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink),inset 0 -2px 0 rgba(0,0,0,.18)}
.b-gold{background:var(--gold);color:#2b1d3a}.b-red{background:var(--red);color:#fff}.b-green{background:var(--green);color:#2b1d3a}.b-purple{background:var(--purple);color:#fff}.b-cream{background:var(--panel);color:#2b1d3a}
h2.sec{font-family:var(--arcade);font-size:11px;color:var(--gold);text-shadow:2px 2px 0 var(--ink);margin:18px 2px 8px;font-weight:400;line-height:1.4}
.hint{font-size:14px;color:#cfc4ff}
.hud{position:sticky;top:0;z-index:30;background:var(--night2);border-bottom:4px solid var(--ink);padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;display:flex;align-items:center;gap:10px}
.portrait{width:50px;height:50px;flex:none;border:3px solid var(--ink);border-radius:8px;background:#6fd3ff;position:relative;overflow:hidden;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
.portrait .face{position:absolute;left:-34px;top:-2px;width:112px;height:96px;background:url(hero.png) 0 0/3672px 96px no-repeat;image-rendering:pixelated}
.lvl{position:absolute;left:-3px;bottom:-3px;font-family:var(--arcade);font-size:10px;background:var(--gold);color:var(--ink);border:3px solid var(--ink);border-radius:6px;padding:2px 3px}
.xpbar{height:14px;border:3px solid var(--ink);border-radius:4px;background:var(--dot);overflow:hidden}
.xpbar i{display:block;height:100%;background:#6fd3ff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.55)}
.chip{display:flex;align-items:center;gap:6px;background:#2e2266;border:3px solid var(--ink);border-radius:6px;padding:2px 9px 2px 5px;font-weight:800;font-size:17px}
.gear{width:38px;height:38px;flex:none;font-size:18px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--night2);border-top:4px solid var(--ink);padding-top:10px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.nav .in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.nav button{padding:11px 0;font-size:16px}
.quest{margin-top:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.road{position:relative;height:76px}
.road .track{position:absolute;left:0;right:0;bottom:6px;height:22px;border:3px solid var(--ink);border-radius:4px;background:#c9b48a;overflow:hidden}
.road .track i{display:block;height:100%;background:var(--hp);box-shadow:inset 0 -4px 0 rgba(0,0,0,.22),inset 0 3px 0 rgba(255,255,255,.45);transition:width .6s}
.road .walker{position:absolute;bottom:24px;transform:translateX(-50%);transition:left .6s}
.road .chest{position:absolute;right:-2px;bottom:26px}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{border:3px solid var(--ink);border-radius:6px;padding:7px 7px 8px;display:flex;flex-direction:column;gap:5px;min-width:0}
.stat b{font-size:22px;line-height:1;font-weight:800}.stat b small{font-size:13px;color:#5b4a7a;font-weight:700}
.stat .lab{font-weight:800;font-size:12px;letter-spacing:.04em}
.meter{height:10px;border:2px solid var(--ink);background:#fff;overflow:hidden}.meter i{display:block;height:100%}
.pips{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:2px}.pips span{height:8px;border:1px solid var(--ink);background:#fff}.pips span.on{background:var(--pwr)}
.loot{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;background:#fff;border:3px dashed var(--ink);border-radius:6px;padding:6px 8px;line-height:1.25}
.tag{font-family:var(--arcade);font-size:9px;border:2px solid var(--ink);padding:3px 4px;flex:none;color:var(--ink);background:var(--gold)}
.map{position:relative;width:100%;aspect-ratio:368/478;border:4px solid var(--ink);border-radius:10px;overflow:hidden;box-shadow:0 5px 0 var(--ink);background:#6cc24a}
.map img{width:100%;height:100%;display:block;image-rendering:pixelated}
.pin{position:absolute;width:48px;height:48px;transform:translate(-50%,-62%);display:flex;align-items:center;justify-content:center;background:none;border:0;padding:0;color:#2b1d3a;z-index:2}
.pin .spr{line-height:0}
.pin .spr svg,.pin .spr img{animation:bob 1.6s ease-in-out infinite;filter:drop-shadow(0 3px 0 rgba(18,12,43,.55))}
.pin .lbl{position:absolute;top:50%;transform:translateY(-50%);background:var(--panel);border:3px solid var(--ink);border-radius:6px;padding:3px 7px 4px;font-weight:800;font-size:13px;line-height:1.2;box-shadow:0 3px 0 var(--ink);white-space:nowrap;text-align:left}
.pin.r .lbl{left:42px}.pin.l .lbl{right:42px;text-align:right}
.pin .lbl em{display:block;font-style:normal;font-size:12px;font-weight:700}
.pin .lbl em::before{content:"";display:inline-block;width:8px;height:8px;margin-right:4px;border:2px solid var(--ink);border-radius:2px;background:currentColor;vertical-align:-1px}
.pin:active .lbl{transform:translateY(-44%)}
.pin.closed .spr{filter:grayscale(.7) brightness(.85)}
.attrib{position:absolute;right:6px;top:6px;z-index:1;font-size:12px;font-weight:700;background:rgba(255,244,214,.92);border:2px solid var(--ink);border-radius:4px;padding:1px 5px;color:#2b1d3a}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:2px 8px;align-items:center;padding:8px 10px;border-bottom:2px solid #e6d9b8;color:#2b1d3a}
.row .nm{font-weight:700;font-size:15px;min-width:0;overflow-wrap:anywhere}
.row .mt{font-size:14px;font-weight:700;color:#5b4a7a}
.row .mt .d{color:var(--red);white-space:nowrap}.row .mt .pw{color:#1d6fa5;white-space:nowrap}
.row .warn{font-size:12px;font-weight:700;background:var(--na);color:var(--ink);border:2px solid var(--ink);border-radius:3px;padding:0 3px;margin-left:4px;white-space:nowrap}
.eat{grid-row:span 2;width:42px;height:42px;font-size:22px;padding:0}
.fav{grid-row:span 2;font-family:var(--arcade);font-size:9px;border:2px solid var(--ink);border-radius:4px;padding:6px 4px;background:#fff;color:#a99bc4;box-shadow:none}
.fav.on{background:var(--gold);color:var(--ink)}
.station{background:var(--purple);color:#fff;font-family:var(--arcade);font-size:9px;padding:7px 10px;border-bottom:3px solid var(--ink);line-height:1.4}
.listbox{overflow:hidden;padding:0}
.search{width:100%;font:600 16px var(--pix);padding:11px 12px;border:3px solid var(--ink);border-radius:7px;background:var(--panel);color:#2b1d3a;box-shadow:0 3px 0 var(--ink);outline:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font-size:14px;padding:5px 9px;border:3px solid var(--ink);border-radius:6px;background:var(--purple);color:#fff;font-weight:700}
.tabs button[aria-pressed=true]{background:var(--gold);color:#2b1d3a;box-shadow:inset 0 3px 0 rgba(255,255,255,.5)}
.bhead{display:flex;align-items:center;gap:10px;margin-top:12px}
.arena{margin-top:12px;border:4px solid var(--ink);border-radius:10px;overflow:hidden;box-shadow:0 5px 0 var(--ink)}
.arena .hpwrap{padding:10px;background:#5ab8f5;border-bottom:3px solid var(--ink)}
.hp{height:26px;border:3px solid var(--ink);border-radius:4px;background:#5a1a28;overflow:hidden;position:relative}
.hp i{display:block;height:100%;background:var(--hp);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),inset 0 3px 0 rgba(255,255,255,.45);transition:width .5s steps(8)}
.hp span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;text-shadow:1px 1px 0 var(--ink)}
.stage{height:210px;position:relative;background:linear-gradient(#6cc4ff 0,#9fdcff 60%,#c9eeff 100%);overflow:hidden}
.stage .ground{position:absolute;left:0;right:0;bottom:0;height:54px;background:#6cc24a;border-top:4px solid var(--ink);background-image:linear-gradient(90deg,#5aae3e 6px,transparent 6px);background-size:24px 100%}
.cloud{position:absolute;left:0;height:auto;animation:drift 30s linear infinite}
.hills{position:absolute;left:0;right:0;bottom:48px;width:100%;height:96px}
.gshadow{position:absolute;bottom:34px;height:10px;border-radius:50%;background:rgba(18,12,43,.28)}
.say{background:var(--panel);color:#2b1d3a;border-top:4px solid var(--ink);padding:10px 12px;font-weight:600;font-size:15px;line-height:1.3;min-height:44px}
.herospr{position:absolute;left:18px;bottom:30px;--s:2;width:calc(68px*var(--s));height:calc(48px*var(--s));background:url(hero.png) 0 0/calc(1836px*var(--s)) calc(48px*var(--s)) no-repeat;image-rendering:pixelated;transition:left .1s}
.herospr.idle{animation:heroIdle 2.72s steps(1) infinite}
.herospr.walk{animation:heroWalk .68s steps(8) infinite}
.bosswrap{position:absolute;right:16px;bottom:36px}
.bossspr{--s:2.2;width:calc(var(--fw)*var(--s));height:calc(72px*var(--s));background-repeat:no-repeat;background-position:0 0;background-size:calc(var(--fw)*17*var(--s)) calc(72px*var(--s));image-rendering:pixelated}
.bossspr.down{animation:bossDown .54s steps(3) infinite}
.bossspr.idle{animation:bossIdle 1.02s steps(6) infinite}
.bosssvg{animation:bob 1.8s ease-in-out infinite}
.hit{animation:hitflash .32s steps(2)}
.shake{animation:shake .3s steps(6)}
.ko{animation:ko .9s ease-in forwards}
.dmg{position:absolute;font-family:var(--arcade);font-size:16px;color:var(--gold);text-shadow:3px 3px 0 var(--ink);pointer-events:none;animation:dmg 1.1s ease-out forwards;z-index:5}
.part{position:absolute;width:6px;height:6px;pointer-events:none;animation:part .7s ease-out forwards;z-index:4}
.banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--arcade);font-size:22px;color:var(--gold);text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink);animation:pop .6s steps(4);white-space:nowrap;z-index:6}
.combo{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;background:var(--gold);color:#2b1d3a;border:4px solid var(--ink);border-radius:10px;box-shadow:0 5px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.55)}
.combo .ci{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:14px;background:var(--panel);border:3px solid var(--ink);border-radius:5px;padding:4px 8px}
.combo .ci b{color:var(--red);flex:none}
.walk2{display:flex;align-items:center;gap:8px;background:#fff;border:3px dashed var(--ink);border-radius:5px;padding:6px 8px;font-weight:600;font-size:13px;line-height:1.25}
.fight{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));margin-top:14px;background:var(--night2);border:4px solid var(--ink);border-radius:10px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:20}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;background:#b98a52;border:4px solid var(--ink);border-radius:10px;padding:10px;box-shadow:0 5px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.25)}
.slot{aspect-ratio:1;background:#f3dcae;border:3px solid var(--ink);border-radius:6px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;padding:2px;color:#2b1d3a;font-size:12px;font-weight:700;line-height:1.05;text-align:center;overflow:hidden}
.slot[aria-pressed=true]{background:var(--gold);box-shadow:0 0 0 3px #fff}
.slot.empty{background:#a07444;border-color:#8a6038;box-shadow:none}
.slot.add{background:#a07444;border-style:dashed;font-size:26px;color:#f3dcae}
.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:12px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--dim);text-transform:uppercase;min-width:0}
.form .w2{grid-column:span 2}.form .w4{grid-column:1/-1}
.form input{font:600 15px var(--pix);padding:8px;border:3px solid var(--ink);border-radius:6px;background:#fff;color:#2b1d3a;width:100%;min-width:0}
.mac4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center}
.mac4 div{border:3px solid var(--ink);border-radius:5px;padding:5px 0}.mac4 b{display:block;font-size:19px;font-weight:800}.mac4 span{font-size:12px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.stats div{text-align:center;padding:8px 4px}.stats b{display:block;font-family:var(--arcade);font-size:15px}.stats span{font-size:13px;font-weight:700}
.cal{margin-top:14px;background:var(--night2);border:4px solid var(--ink);border-radius:10px;box-shadow:0 5px 0 var(--ink);padding:10px}
.calhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.calhd button{width:38px;height:38px;font-size:16px}
.dow,.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dow{font-weight:800;font-size:13px;color:var(--muted);text-align:center;margin-bottom:6px}
.tile{aspect-ratio:1;border:3px solid var(--ink);border-radius:6px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:2px 0 3px;font-family:var(--pix);font-weight:800;font-size:13px;line-height:1;color:var(--ink);background:none}
.legend{background:conic-gradient(from var(--a,0deg),#ffcc3d,#ff6b6b,#c38bff,#3ec7ff,#5be36b,#ffcc3d);box-shadow:0 3px 0 var(--ink);animation:spin 3s linear infinite}
.legend::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.7) 45%,transparent 60%);background-size:250% 100%;animation:shine 2.2s ease-in-out infinite}
.rare{background:var(--green);box-shadow:0 3px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.5)}
.unc{background:var(--gold);box-shadow:0 3px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.5)}
.none{background:#2e2266;color:#7f70b8;border-style:dashed}
.empty{background:transparent;color:#4d3f8f;border-color:#33276b}
.today{box-shadow:0 0 0 3px var(--pwr)}
.blank{border:0;visibility:hidden}
.legendkey{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px;margin-top:14px;font-size:14px;font-weight:600;color:#e6dcff}
.legendkey div{display:flex;align-items:center;gap:8px}.legendkey .tile{width:22px;flex:none;padding:0}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;font-weight:700;font-size:14px}
.checks span{border:3px solid var(--ink);border-radius:5px;padding:4px 6px;background:#fff}.checks span.ok{background:var(--green)}
.step{display:flex;align-items:center;gap:6px}.step button{width:34px;height:34px;font-size:18px;padding:0}.step b{min-width:34px;text-align:center}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(18,12,43,.75);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{width:100%;max-width:460px;max-height:88vh;overflow:auto;padding:14px max(12px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
.victory{position:fixed;inset:0;z-index:70;background:var(--night);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;overflow:hidden;padding:20px}
.rays{position:absolute;left:50%;top:40%;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;opacity:.5;background:repeating-conic-gradient(from var(--r) at 50% 50%,#ffcc3d 0deg 10deg,#ff9a3c 10deg 20deg);animation:rays 12s linear infinite}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--panel);color:#2b1d3a;border:3px solid var(--ink);border-radius:7px;box-shadow:0 4px 0 var(--ink);padding:8px 12px;font-weight:700;font-size:14px;max-width:92vw}
.banner2{margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--pwr);color:var(--ink);border:3px solid var(--ink);border-radius:6px;padding:6px 8px;font-weight:700;font-size:14px}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
@property --r{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes spin{to{--a:360deg}}@keyframes rays{to{--r:360deg}}
@keyframes shine{0%{background-position:150% 0}100%{background-position:-100% 0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes drift{from{transform:translateX(-100px)}to{transform:translateX(480px)}}
@keyframes heroIdle{0.000%{background-position-x:calc(0px*var(--s))}5.882%{background-position-x:calc(-68px*var(--s))}11.765%{background-position-x:calc(-136px*var(--s))}17.647%{background-position-x:calc(-204px*var(--s))}23.529%{background-position-x:calc(0px*var(--s))}29.412%{background-position-x:calc(-68px*var(--s))}35.294%{background-position-x:calc(-136px*var(--s))}41.176%{background-position-x:calc(-204px*var(--s))}47.059%{background-position-x:calc(0px*var(--s))}52.941%{background-position-x:calc(-68px*var(--s))}58.824%{background-position-x:calc(-136px*var(--s))}64.706%{background-position-x:calc(-204px*var(--s))}70.588%{background-position-x:calc(0px*var(--s))}76.471%{background-position-x:calc(-68px*var(--s))}82.353%{background-position-x:calc(-136px*var(--s))}88.235%{background-position-x:calc(-204px*var(--s))}94.118%{background-position-x:calc(-272px*var(--s))}}
@keyframes heroWalk{from{background-position-x:calc(-340px*var(--s))}to{background-position-x:calc(-884px*var(--s))}}
@keyframes bossIdle{from{background-position-x:0}to{background-position-x:calc(var(--fw)*-6*var(--s))}}
@keyframes bossDown{from{background-position-x:calc(var(--fw)*-14*var(--s))}to{background-position-x:calc(var(--fw)*-17*var(--s))}}
@keyframes hitflash{0%{filter:brightness(4) saturate(0)}100%{filter:none}}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,3px)}80%{transform:translate(3px,-2px)}}
@keyframes ko{0%{transform:none;opacity:1}40%{transform:translateY(-10px) rotate(-8deg)}100%{transform:translateY(30px) rotate(80deg);opacity:.85}}
@keyframes dmg{0%{transform:translateY(0) scale(.6);opacity:0}15%{transform:translateY(-6px) scale(1.25);opacity:1}100%{transform:translateY(-60px) scale(1);opacity:0}}
@keyframes part{to{transform:translate(var(--dx),var(--dy));opacity:0}}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3)}100%{transform:translate(-50%,-50%) scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="hud gut" id="hud"></header>
  <main class="gut" id="view"><p class="hint" style="margin-top:20px">Loading the campus…</p></main>
</div>
<nav class="nav gut" aria-label="Screens"><div class="in">
  <button class="btn b-gold" data-act="tab" data-t="map" aria-pressed="true">MAP</button>
  <button class="btn b-purple" data-act="tab" data-t="pack" aria-pressed="false">BACKPACK</button>
  <button class="btn b-purple" data-act="tab" data-t="trophies" aria-pressed="false">TROPHIES</button>
</div></nav>
<div id="overlay"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>Math.round(n||0).toLocaleString();
const f1=n=>(Math.round((n||0)*10)/10).toLocaleString();
const pad=n=>String(n).padStart(2,"0");
const questNow=()=>new Date(Date.now()-4*3600e3);
const dayId=(d=questNow())=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const menuKey=(d=questNow())=>pad(d.getMonth()+1)+"/"+pad(d.getDate())+"/"+d.getFullYear();
const fromId=id=>{const [y,m,d]=id.split("-").map(Number);return new Date(y,m-1,d)};
const niceDay=id=>fromId(id).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
const MEALS={B:"Breakfast",L:"Lunch",D:"Dinner",N:"Late Night",G:"Grab 'n Go"};
const G0={kcal:3400,protein:170,sugar:50,sodium:2300};
const CC_NAMES=["Harvest Market","Deli Delish","Green Fields","The Grill","Star Ginger","Tamales","Tavola","Yum! Bakery","Wasabi","People's Organic Coffee"];
const HALLS={
  berk:{name:"Berkshire",boss:"Berkshire Bear",locs:[3],spr:"bear",x:90,y:454,side:"r"},
  wor:{name:"Worcester",boss:"Worcester Wyrm",locs:[0],spr:"wyrm",x:225,y:83,side:"r"},
  frank:{name:"Franklin",boss:"Frankenfrank",locs:[1],spr:"frank",x:286,y:208,side:"l"},
  hamp:{name:"Hampshire",boss:"Hampshire Hog",locs:[2],spr:"hog",x:93,y:397,side:"r"},
  cc:{name:"Campus Center",boss:"The Blue Wall",locs:[],spr:"wall",x:163,y:118,retail:true,side:"l"}
};
const SHEETS={berk:{src:'bear.png',fw:72},wor:{src:'wyrm.png',fw:82},frank:{src:'frank.png',fw:76}};
const PINS={berk:'pin_berk.png',berk_h:46,wor:'pin_wor.png',wor_h:46,frank:'pin_frank.png',frank_h:46};
let SPR={},DATA=[],LOCS=[],ST=[],DATES=[],BYK=new Map(),TIDX=-1;
let DAYS={},CUSTOM=[],GOALS={...G0},FAVES=[];
const S={tab:"map",hall:null,meal:null,q:"",pq:"",ptab:"items",sel:null,logDay:null,month:null,fight:[],adding:false,dayOpen:null};
let pushDoc=()=>{};
const SND={on:false,ctx:null,buf:{},music:null,cur:null,want:null};
try{SND.on=localStorage.getItem("gq-sound")==="1"}catch(e){}
function sndInit(){if(SND.ctx)return true;try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}
  try{SND.ctx=new(window.AudioContext||window.webkitAudioContext)();SND.master=SND.ctx.createGain();SND.master.connect(SND.ctx.destination);return true}catch(e){toast("Sound isn't supported here");return false}}
function sndLoad(n){if(!SND.buf[n])SND.buf[n]=fetch("audio/"+n+".wav").then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.arrayBuffer()}).then(a=>new Promise((res,rej)=>SND.ctx.decodeAudioData(a,res,rej))).catch(e=>{delete SND.buf[n];throw e});return SND.buf[n]}
function sfx(n,vol=.8){if(!SND.on||!SND.ctx)return;sndLoad(n).then(b=>{const src=SND.ctx.createBufferSource();src.buffer=b;const g=SND.ctx.createGain();g.gain.value=vol;src.connect(g);g.connect(SND.master);src.start()}).catch(()=>{})}
function stopMusic(){const m=SND.music;SND.music=null;SND.cur=null;if(m&&SND.ctx){const t=SND.ctx.currentTime;m.g.gain.setTargetAtTime(0,t,.12);try{m.src.stop(t+.6)}catch(e){}}}
function music(n){SND.want=n;if(!SND.on||!SND.ctx||SND.cur===n)return;stopMusic();SND.cur=n;
  sndLoad(n).then(b=>{if(SND.cur!==n||!SND.on)return;const src=SND.ctx.createBufferSource();src.buffer=b;src.loop=true;const g=SND.ctx.createGain();g.gain.value=0;g.gain.setTargetAtTime(.5,SND.ctx.currentTime,.25);src.connect(g);g.connect(SND.master);src.start();SND.music={src,g}})
  .catch(e=>{SND.cur=null;toast("Music couldn't load ("+(e&&e.message||"error")+")")})}
function jingle(){if(!SND.on||!SND.ctx)return;const m=SND.music,t=SND.ctx.currentTime;if(m){m.g.gain.setTargetAtTime(.06,t,.1);setTimeout(()=>{if(SND.music===m)m.g.gain.setTargetAtTime(.5,SND.ctx.currentTime,.4)},5200)}sfx("legendary",1)}
function toggleSound(){SND.on=!SND.on;try{localStorage.setItem("gq-sound",SND.on?"1":"0")}catch(e){}
  if(SND.on){if(!sndInit()){SND.on=false;return}SND.ctx.resume();const w=SND.want;SND.cur=null;music(w);sfx("sfx_coin");["sfx_hit","sfx_ko","legendary"].forEach(n=>sndLoad(n).catch(()=>{}))}else stopMusic();renderHUD()}
document.addEventListener("pointerdown",()=>{if(SND.on&&(!SND.ctx||SND.ctx.state!=="running")){if(sndInit()){SND.ctx.resume();const w=SND.want;SND.cur=null;music(w)}}},true);


function spr(name,px,label){const d=SPR[name];if(!d)return"";const[rows,pal]=d;const w=Math.max(...rows.map(r=>r.length)),h=rows.length,paths={};
  rows.forEach((r,y)=>{let x=0;while(x<r.length){const c=r[x];if(c==="."){x++;continue}const s0=x;while(x<r.length&&r[x]===c)x++;(paths[c]=paths[c]||[]).push(`M${s0} ${y}h${x-s0}v1h-${x-s0}z`)}});
  return `<svg width="${w*px}" height="${h*px}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" ${label?`role="img" aria-label="${esc(label)}"`:'aria-hidden="true"'}>${Object.entries(paths).map(([c,v])=>`<path fill="${pal[c]}" d="${v.join("")}"/>`).join("")}</svg>`}

const X=r=>[r[11],r[12],r[13],r[14],r[15],r[16]];
const fromRow=r=>({k:r._k,n:r[0],s:r[1],v:[r[2]||0,r[3]||0,r[4]||0,r[5]||0],x:X(r)});
const ckey=c=>"mine|"+c.n.toLowerCase()+"|"+String(c.s||"1 serving").toLowerCase();
const fromCustom=c=>({k:ckey(c),n:c.n,s:c.s||"1 serving",v:[+c.k||0,+c.p||0,+c.c||0,+c.f||0],x:[c.fi??null,c.su??null,c.sf??null,null,null,c.na??null]});
function lookup(k){if(k.startsWith("mine|")){const c=CUSTOM.find(c=>ckey(c)===k);return c?fromCustom(c):null}const r=BYK.get(k);return r?fromRow(r):null}
function totals(items){const t={k:0,p:0,c:0,f:0,fi:0,su:0,sf:0,na:0,n:0};for(const e of items||[]){const q=e.q||1;t.k+=e.v[0]*q;t.p+=e.v[1]*q;t.c+=e.v[2]*q;t.f+=e.v[3]*q;const x=e.x||[];t.fi+=(x[0]||0)*q;t.su+=(x[1]||0)*q;t.sf+=(x[2]||0)*q;t.na+=(x[5]||0)*q;t.n++}return t}
function checks(t){return{cal:t.k>=GOALS.kcal,pro:t.p>=GOALS.protein,sug:t.su<=GOALS.sugar,na:t.na<=GOALS.sodium}}
function grade(items){if(!items||!items.length)return"empty";const c=checks(totals(items));if(!c.cal)return"none";const n=[c.pro,c.sug,c.na].filter(Boolean).length;return n===3?"legend":n===2?"rare":n===1?"unc":"none"}
function dayXP(items){if(!items||!items.length)return 0;const c=checks(totals(items));return(c.cal?100:0)+(c.pro?50:0)+(c.sug?25:0)+(c.na?25:0)+(grade(items)==="legend"?100:0)}
const curDay=()=>S.logDay||dayId();
const dayItems=id=>(DAYS[id]&&DAYS[id].items)||[];

function curMeal(){const n=new Date(),h=n.getHours()+n.getMinutes()/60;return h<10.5?"B":h<16.5?"L":h<21?"D":"N"}
const servedToday=r=>TIDX<0||((r[10]>>TIDX)&1)===1;
function hallRows(hk){const h=HALLS[hk];return DATA.filter(r=>r._l.some(i=>h.locs.includes(i))&&servedToday(r))}
function stationOf(r,hk){return HALLS[hk].retail?LOCS[r._l.find(i=>HALLS[hk].locs.includes(i))]:(ST[r[8]]||"Other")}
const isBig=r=>(r[2]||0)>=150&&(r[2]||0)<=1400&&!/sauce|dressing|topping|broth|condiment|chutney|gravy|syrup/i.test(r[0]);
function comboFor(hk,meal){
  const t=totals(dayItems(curDay()));const rem=GOALS.kcal-t.k;
  let rows=hallRows(hk).filter(r=>HALLS[hk].retail||!meal||r[7].includes(meal)||r[7].includes("G")).filter(isBig);
  const seen=new Set();rows=rows.filter(r=>!seen.has(r[0])&&seen.add(r[0]));
  if(rem<=0){return{mode:"pwr",items:rows.filter(r=>(r[3]||0)>=12).sort((a,b)=>b[3]-a[3]).slice(0,3),rem:Math.max(0,GOALS.protein-t.p)}}
  rows.sort((a,b)=>b[2]-a[2]);const pick=[];let left=rem;
  for(const r of rows){if(left<=0||pick.length>=5)break;pick.push(r);left-=r[2]}
  return{mode:"kcal",items:pick,rem}}
function worthWalk(hk){const locs=HALLS[hk].locs;const fav=new Set(FAVES);
  const rows=DATA.filter(r=>servedToday(r)&&!r._l.some(i=>locs.includes(i))&&isBig(r)&&(r[2]||0)>=350);
  rows.sort((a,b)=>((fav.has(b._k)?1e4:0)+b[2])-((fav.has(a._k)?1e4:0)+a[2]));return rows[0]}
function nextServed(k){const base=BYK.get(k);if(!base)return null;let best=null;
  for(const r of DATA){if(r[0]!==base[0])continue;for(let i=Math.max(TIDX,0);i<DATES.length;i++){if((r[10]>>i)&1){if(!best||i<best.i)best={i,r};break}}}
  return best}

function loadLocal(){try{const s=JSON.parse(localStorage.getItem("gq-state")||"null");if(s){DAYS=s.days||{};CUSTOM=s.foods||[];GOALS={...G0,...(s.goals||{})};FAVES=s.faves||[]}}catch(e){}
  try{const old=JSON.parse(localStorage.getItem("macro-custom-foods")||"null");if(Array.isArray(old)&&!CUSTOM.length)CUSTOM=old}catch(e){}}
function saveLocal(){try{localStorage.setItem("gq-state",JSON.stringify({days:DAYS,foods:CUSTOM,goals:GOALS,faves:FAVES}))}catch(e){}}
function persistDay(id){saveLocal();pushDoc("days/"+id,{day:id,items:dayItems(id),celebrated:!!(DAYS[id]&&DAYS[id].celebrated)})}
function persistMeta(name){saveLocal();const body=name==="foods"?{items:CUSTOM}:name==="goals"?{...GOALS}:{keys:FAVES};pushDoc("meta/"+name,body)}

function eat(item,q){const id=curDay();const d=DAYS[id]||(DAYS[id]={items:[]});d.items=d.items||[];
  const e=d.items.find(x=>x.k===item.k);if(e)e.q=Math.round((e.q+q)*2)/2;else d.items.push({k:item.k,n:item.n,s:item.s,v:item.v,x:item.x,q});
  persistDay(id);return item.v[0]*q}
function setQty(id,k,dq){const d=DAYS[id];if(!d)return;const e=d.items.find(x=>x.k===k);if(!e)return;e.q=Math.round((e.q+dq)*2)/2;if(e.q<=0)d.items=d.items.filter(x=>x!==e);persistDay(id)}
function toggleFav(k){FAVES=FAVES.includes(k)?FAVES.filter(x=>x!==k):[...FAVES,k];persistMeta("faves")}
function toast(t){document.querySelectorAll(".toast").forEach(x=>x.remove());const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1800)}
function buzz(){try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}}

function renderHUD(){
  const xp=Object.values(DAYS).reduce((a,d)=>a+dayXP(d.items),0),lvl=1+Math.floor(xp/500),into=xp%500;
  let streak=0;for(let i=0;i<400;i++){const g=grade(dayItems(dayId(new Date(Date.now()-4*3600e3-i*864e5))));if(i===0&&(g==="none"||g==="empty"||g==="unc"))continue;if(g==="legend"||g==="rare")streak++;else break}
  const loot=Object.values(DAYS).filter(d=>["legend","rare","unc"].includes(grade(d.items))).length;
  $("#hud").innerHTML=`<div class="portrait"><div class="face" aria-hidden="true"></div><span class="lvl">${lvl}</span></div>
   <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:6px"><span class="arc" style="font-size:13px">CHRIS</span><span style="font-weight:700;font-size:14px;color:#e6dcff">${into}/500 XP</span></div><div class="xpbar"><i style="width:${into/5}%"></i></div></div>
   <div style="display:flex;flex-direction:column;gap:5px;flex:none"><span class="chip" title="Days in a row with rare or better loot">${spr("flame",3)}${streak}</span><span class="chip" title="Days with loot">${spr("chest",2)}${loot}</span></div>
   <div style="display:flex;flex-direction:column;gap:5px;flex:none"><button class="btn ${SND.on?"b-green":"b-cream"} gear" style="height:32px;font-size:16px" data-act="sound" aria-pressed="${SND.on}" aria-label="${SND.on?"Mute music":"Turn music on"}"><svg width="18" height="18" viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true"><path fill="#2b1d3a" d="M1 4h3v4h-3zM4 3h1v6h-1zM5 2h1v8h-1z"/>${SND.on?'<path fill="#2b1d3a" d="M8 4h1v4h-1zM10 2h1v8h-1z"/>':'<path fill="#c2273a" d="M7 4h1v1h-1zM8 5h1v1h-1zM9 6h1v1h-1zM10 7h1v1h-1zM10 4h1v1h-1zM9 5h1v1h-1zM8 6h1v1h-1zM7 7h1v1h-1z"/>'}</svg></button><button class="btn b-cream gear" style="height:32px;font-size:16px" data-act="goals" aria-label="Edit goals">⚙</button></div>`}

function renderMap(){
  const id=dayId(),items=dayItems(id),t=totals(items),c=checks(t),g=grade(items),pct=Math.min(100,t.k/GOALS.kcal*100);
  const pips=Math.min(10,Math.floor(t.p/GOALS.protein*10));
  const miss=[!c.pro&&"protein",!c.sug&&"sugar cap",!c.na&&"sodium cap"].filter(Boolean).join(", ");
  const lootTxt=!t.n?"Eat something to start today's quest.":!c.cal?`${fmt(GOALS.kcal-t.k)} DMG left to beat the boss. Loot needs calories first.`:g==="legend"?"LEGENDARY secured. Stay under your sugar and sodium caps.":`Boss down: <b>${g==="rare"?"RARE":g==="unc"?"UNCOMMON":"no"}</b> loot so far. Missing: ${miss}.`;
  const meal=curMeal();
  const pins=Object.entries(HALLS).map(([k,h])=>{const rows=hallRows(k);const open=h.retail?rows.length>0:rows.some(r=>r[7].includes(meal));
    const status=!rows.length?"No menu":open?(h.retail?"Open today":MEALS[meal]):"No "+MEALS[meal].toLowerCase();
    return `<button class="pin ${h.side}${open?"":" closed"}" data-act="hall" data-h="${k}" style="left:${h.x/368*100}%;top:${h.y/478*100}%" aria-label="Fight ${esc(h.boss)} at ${esc(h.name)}"><span class="spr">${PINS[k]?`<img src="${PINS[k]}" alt="" style="display:block;height:${PINS[k+'_h']}px;image-rendering:pixelated;filter:drop-shadow(0 3px 0 rgba(18,12,43,.55))">`:spr(h.spr,2.25)}</span><span class="lbl">${esc(h.name)}<em style="color:${open?"#1f9a3a":"#8a7aa8"}">${status}</em></span></button>`}).join("");
  const cb=comboFor("berk",meal),ww=worthWalk("berk");
  const faves=FAVES.map(k=>({k,ns:nextServed(k)})).filter(f=>f.ns).sort((a,b)=>a.ns.i-b.ns.i).slice(0,4);
  $("#view").innerHTML=`
  ${S.logDay&&S.logDay!==id?logBanner():""}
  <section class="panel quest">
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="arc" style="font-size:10px;color:var(--red)">DAILY QUEST</span><span style="font-weight:600;font-size:14px;color:var(--dim)">${niceDay(id)}</span></div>
    <div style="font-weight:700;font-size:26px;line-height:1">${fmt(t.k)} <span style="font-size:16px;color:var(--dim)">/ ${fmt(GOALS.kcal)} DMG</span></div>
    <div class="road"><div class="track"><i style="width:${pct}%"></i></div>
      <div class="walker" style="left:${Math.max(6,Math.min(88,pct))}%"><div class="herospr walk" style="--s:1.2;position:static"></div></div>
      <div class="chest">${spr("chest",3.6,"Loot chest")}</div></div>
    <div class="stats3">
      <div class="stat" style="background:#e3f7ff"><span class="lab" style="color:#1d6fa5">POWER</span><b>${fmt(t.p)}<small>/${GOALS.protein}g</small></b><div class="pips">${Array.from({length:10},(_,i)=>`<span class="${i<pips?"on":""}"></span>`).join("")}</div></div>
      <div class="stat" style="background:#ffe6f6"><span class="lab" style="color:#b0287f">SUGAR</span><b>${fmt(t.su)}<small>/${GOALS.sugar}g</small></b><div class="meter"><i style="width:${Math.min(100,t.su/GOALS.sugar*100)}%;background:${t.su>GOALS.sugar?"var(--red)":"var(--sug)"}"></i></div></div>
      <div class="stat" style="background:#fff0de"><span class="lab" style="color:#b5520e">SODIUM</span><b>${fmt(t.na)}<small>mg</small></b><div class="meter"><i style="width:${Math.min(100,t.na/GOALS.sodium*100)}%;background:${t.na>GOALS.sodium?"var(--red)":"var(--na)"}"></i></div></div>
    </div>
    <div class="loot"><span class="tag">LOOT</span><span>${lootTxt}</span></div>
  </section>
  ${todayLog(id,items,t)}
  <h2 class="sec">CHOOSE YOUR BOSS</h2>
  <div class="map"><img src="map.png" alt="Pixel-art map of the UMass Amherst campus, traced from the official campus map">${pins}<span class="attrib">Traced from the official UMass map</span></div>
  ${TIDX<0?`<p class="hint" style="margin-top:10px">Menu data ends ${esc(DATES[DATES.length-1])}. Ask Claude to refresh the menus.</p>`:""}
  ${cb.items.length?`<h2 class="sec">NEXT MOVE · BERK ${esc(MEALS[meal].toUpperCase())}</h2>${comboHTML(cb,"berk",ww)}`:""}
  <h2 class="sec">FAVES SPOTTED</h2>
  ${faves.length?`<div class="panel listbox">${faves.map(f=>{const i=f.ns.i;const when=i===TIDX?"TODAY":DATES[i].slice(0,5);return `<div class="row" style="grid-template-columns:auto minmax(0,1fr)"><span class="tag" style="background:${i===TIDX?"var(--green)":"#e6e0f5"}">${when}</span><span><span class="nm">${esc(f.ns.r[0])}</span><br><span class="mt">${esc(f.ns.r._l.map(x=>LOCS[x]).join(", "))} · <span class="d">${fmt(f.ns.r[2])} DMG</span></span></span></div>`}).join("")}</div>`:`<p class="hint">Tap FAV on any food and this tells you when and where it's served next.</p>`}
  <button class="btn b-gold" data-act="tab" data-t="pack" style="width:100%;margin-top:18px;padding:12px;display:flex;align-items:center;gap:10px;text-align:left">${spr("choc",4)}<span style="display:flex;flex-direction:column;line-height:1.15"><span style="font-size:18px">BACKPACK</span><span style="font-weight:600;font-size:13px">Dorm snack or drink? Log it here, no boss fight.</span></span></button>`}
function todayLog(id,items,t){
  const rows=items.slice().reverse().map(e=>`<div class="row" style="grid-template-columns:minmax(0,1fr) auto"><span class="nm">${esc(e.n)}</span><span class="step" style="grid-row:span 2"><button class="btn b-cream" data-act="qty" data-d="${id}" data-k="${esc(e.k)}" data-dq="-0.5" aria-label="Less ${esc(e.n)}">−</button><b>${e.q}×</b><button class="btn b-cream" data-act="qty" data-d="${id}" data-k="${esc(e.k)}" data-dq="0.5" aria-label="More ${esc(e.n)}">+</button></span><span class="mt">${esc(e.s)} · <span class="d">${fmt(e.v[0]*e.q)} kcal</span> · <span class="pw">${f1(e.v[1]*e.q)}g P</span></span></div>`).join("");
  return `<h2 class="sec">TODAY'S LOG · ${items.length} ITEM${items.length===1?"":"S"}</h2>
  <div class="panel listbox">${items.length?rows+`<div style="padding:10px 12px;background:var(--panel2);display:flex;flex-direction:column;gap:8px">

function renderPack(){

      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">${[.5,1,2].map(q=>`<button class="btn b-green" style="padding:10px 0;font-size:16px" data-act="use" data-q="${q}">USE ×${q===.5?"½":q}</button>`).join("")}</div>
      <button class="btn b-cream" style="padding:6px;font-size:13px" data-act="delitem">Remove from backpack</button></section>`:`<p class="hint" style="margin-top:12px">Tap an item to use it. Tap + to add a new snack with its label numbers.</p>`}
    ${S.adding?addForm():""}`}
  else if(S.ptab==="search"){body=`<input class="search" style="margin-top:12px" type="search" id="pq" placeholder="Search every food on campus…" aria-label="Search every food on campus" value="${esc(S.pq)}" autocomplete="off"><div class="panel listbox" style="margin-top:10px" id="plist"></div>`}
  else{const f=FAVES.map(k=>({k,r:BYK.get(k),ns:nextServed(k)})).filter(x=>x.r);

  $("#view").innerHTML=`${S.logDay&&S.logDay!==dayId()?logBanner():""}
   <div style="margin-top:14px"><span class="arc" style="font-size:15px;color:var(--gold);text-shadow:3px 3px 0 var(--ink)">BACKPACK</span><p class="hint" style="margin:6px 0 0">Snacks and drinks count toward the daily quest without a boss fight.</p></div>
   <div class="tabs" style="margin-top:12px">${tabs.map(([k,l])=>`<button data-act="ptab" data-t="${k}" aria-pressed="${S.ptab===k}">${l}</button>`).join("")}</div>${body}`;
  if(S.ptab==="search")renderPackSearch()}
function addForm(){return `<form class="panel form" id="addf" style="margin-top:16px">
  <label class="w4">Name<input id="f-n" required placeholder="e.g. Celsius energy drink"></label>
  <label class="w4">Serving<input id="f-s" placeholder="e.g. 1 can"></label>
  <label>Calories<input id="f-k" inputmode="decimal" required></label><label>Protein g<input id="f-p" inputmode="decimal"></label><label>Carbs g<input id="f-c" inputmode="decimal"></label><label>Fat g<input id="f-f" inputmode="decimal"></label>
  <label>Sugar g<input id="f-su" inputmode="decimal"></label><label>Fiber g<input id="f-fi" inputmode="decimal"></label><label>Sat fat g<input id="f-sf" inputmode="decimal"></label><label>Sodium mg<input id="f-na" inputmode="decimal"></label>
  <div class="w4" style="display:flex;gap:8px;justify-content:flex-end;align-items:center"><span id="f-err" style="margin-right:auto;color:var(--red);font-weight:700;font-size:13px"></span><button type="button" class="btn b-cream" style="padding:8px 12px" data-act="canceladd">Cancel</button><button type="submit" class="btn b-gold" style="padding:8px 12px">Save to backpack</button></div></form>`}
function renderPackSearch(){
  const q=S.pq.toLowerCase().trim().split(/\s+/).filter(Boolean);const el=$("#plist");if(!el)return;
  if(!q.length){el.innerHTML=`<p style="padding:14px;margin:0;color:var(--dim);font-weight:600">${DATA.length.toLocaleString()} foods from 28 campus spots. Type to search.</p>`;return}
  const mine=CUSTOM.map(fromCustom).filter(c=>q.every(t=>c.n.toLowerCase().includes(t)));
  const rows=DATA.filter(r=>q.every(t=>r._s.includes(t))).sort((a,b)=>(+servedToday(b)-+servedToday(a))||b[2]-a[2]).slice(0,80);
  el.innerHTML=mine.map(c=>`<div class="row"><span class="nm">${esc(c.n)} <span class="tag" style="font-size:8px">MINE</span></span><span></span><button class="btn b-green eat" data-act="eat" data-k="${esc(c.k)}" aria-label="Eat ${esc(c.n)}">+</button><span class="mt">${esc(c.s)} · <span class="d">${fmt(c.v[0])} DMG</span> · <span class="pw">${fmt(c.v[1])} PWR</span></span></div>`).join("")
   +rows.map(r=>itemRow(r,r._l.map(i=>LOCS[i]).join(", ")+(TIDX>=0&&servedToday(r)?" · today":""))).join("")
   ||`<p style="padding:14px;margin:0;color:var(--dim);font-weight:600">No match. Add it yourself under Items.</p>`}

function renderTrophies(){
  if(!S.month){const t=fromId(dayId());S.month=new Date(t.getFullYear(),t.getMonth(),1)}
  const m=S.month,y=m.getFullYear(),mo=m.getMonth(),first=new Date(y,mo,1).getDay(),n=new Date(y,mo+1,0).getDate(),today=dayId();
  const all=Object.values(DAYS).filter(d=>d.items&&d.items.length);
  const leg=all.filter(d=>grade(d.items)==="legend").length,beaten=all.filter(d=>checks(totals(d.items)).cal).length;
  let best=0,run=0,prevId=null;Object.keys(DAYS).sort().forEach(id=>{const g=grade(dayItems(id));const consec=prevId&&Math.round((fromId(id)-fromId(prevId))/864e5)===1;run=(g==="legend"||g==="rare")?(consec?run+1:1):0;best=Math.max(best,run);prevId=id});
  let tiles="";for(let i=0;i<first;i++)tiles+=`<div class="tile blank"></div>`;
  for(let d=1;d<=n;d++){const id=y+"-"+pad(mo+1)+"-"+pad(d);const fut=id>today;const g=fut?"empty":grade(dayItems(id));
    const icon=g==="legend"?spr("crown",3):g==="rare"?spr("gem",3):g==="unc"?spr("coin",3):"";
    tiles+=`<button class="tile ${g}${id===today?" today":""}" data-act="day" data-d="${id}" ${fut?"disabled":""} aria-label="${niceDay(id)}: ${({legend:"legendary",rare:"rare",unc:"uncommon",none:"boss escaped",empty:"nothing logged"})[g]}"><span>${d}</span><span style="position:relative;z-index:1">${icon}</span></button>`}
  $("#view").innerHTML=`<div style="margin-top:14px"><span class="arc" style="font-size:15px;color:var(--gold);text-shadow:3px 3px 0 var(--ink)">TROPHY WALL</span></div>
   <div class="stats"><div class="panel"><b style="color:#c99300">${leg}</b><span>Legendary</span></div><div class="panel"><b style="color:#1f9a3a">${beaten}</b><span>Bosses beaten</span></div><div class="panel"><b style="color:#e0640f">${best}</b><span>Best streak</span></div></div>
   <section class="cal"><div class="calhd"><button class="btn b-cream" data-act="month" data-dir="-1" aria-label="Previous month">◀</button><span class="arc" style="font-size:12px">${m.toLocaleDateString(undefined,{month:"short",year:"numeric"}).toUpperCase()}</span><button class="btn b-cream" data-act="month" data-dir="1" aria-label="Next month">▶</button></div>
    <div class="dow"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div><div class="grid7">${tiles}</div></section>
   <div class="legendkey"><div><span class="tile legend"></span>Legendary · all 4</div><div><span class="tile rare"></span>Rare · calories + 2</div><div><span class="tile unc"></span>Uncommon · calories + 1</div><div><span class="tile none"></span>Boss escaped</div></div>
   <p class="hint" style="margin-top:12px">Tap a day to see or fix its log.</p>`}
function openDay(id){S.dayOpen=id;const items=dayItems(id),t=totals(items),c=checks(t),g=grade(items);
  $("#overlay").innerHTML=`<div class="sheet" data-act="closesheet"><div class="in panel" style="border-radius:14px 14px 0 0" data-stop="1" role="dialog" aria-label="${niceDay(id)}">
   <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><b style="font-size:19px">${niceDay(id)}</b><span style="font-weight:700;color:var(--dim)">${({legend:"LEGENDARY",rare:"RARE",unc:"UNCOMMON",none:"BOSS ESCAPED",empty:"NOTHING LOGGED"})[g]}</span></div>
   <div class="checks" style="margin-top:10px"><span class="${c.cal?"ok":""}">${c.cal?"✓":"✗"} ${fmt(t.k)} / ${fmt(GOALS.kcal)} DMG</span><span class="${c.pro?"ok":""}">${c.pro?"✓":"✗"} ${fmt(t.p)} / ${GOALS.protein}g PWR</span><span class="${c.sug?"ok":""}">${c.sug?"✓":"✗"} ${fmt(t.su)}g sugar</span><span class="${c.na?"ok":""}">${c.na?"✓":"✗"} ${fmt(t.na)}mg Na</span></div>
   <div style="margin-top:12px;border:3px solid var(--ink);border-radius:8px;overflow:hidden;background:#fff">${items.length?items.map(e=>`<div class="row" style="grid-template-columns:minmax(0,1fr) auto"><span class="nm">${esc(e.n)}</span><span class="step" style="grid-row:span 2"><button class="btn b-cream" data-act="qty" data-d="${id}" data-k="${esc(e.k)}" data-dq="-0.5" aria-label="Less ${esc(e.n)}">−</button><b>${e.q}×</b><button class="btn b-cream" data-act="qty" data-d="${id}" data-k="${esc(e.k)}" data-dq="0.5" aria-label="More ${esc(e.n)}">+</button></span><span class="mt">${esc(e.s)} · <span class="d">${fmt(e.v[0]*e.q)} DMG</span> · <span class="pw">${f1(e.v[1]*e.q)} PWR</span></span></div>`).join(""):`<p style="padding:12px;margin:0;font-weight:600;color:var(--dim)">Nothing logged.</p>`}</div>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"><button class="btn b-gold" style="padding:10px" data-act="logto" data-d="${id}">Add food to this day</button><button class="btn b-cream" style="padding:10px" data-act="closesheet">Close</button></div></div></div>`}
function openGoals(){$("#overlay").innerHTML=`<div class="sheet" data-act="closesheet"><form class="in panel form" style="border-radius:14px 14px 0 0" data-stop="1" id="goalf" aria-label="Daily goals">
  <b class="w4" style="font-size:19px">Daily goals</b>
  <label class="w2">Calories (at least)<input id="g-k" inputmode="numeric" value="${GOALS.kcal}"></label><label class="w2">Protein g (at least)<input id="g-p" inputmode="numeric" value="${GOALS.protein}"></label>
  <label class="w2">Sugar g (at most)<input id="g-su" inputmode="numeric" value="${GOALS.sugar}"></label><label class="w2">Sodium mg (at most)<input id="g-na" inputmode="numeric" value="${GOALS.sodium}"></label>
  <div class="w4" style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn b-cream" style="padding:8px 12px" data-act="closesheet">Cancel</button><button type="submit" class="btn b-gold" style="padding:8px 12px">Save goals</button></div></form></div>`}

function render(){renderHUD();
  document.querySelectorAll(".nav button").forEach(b=>{const on=b.dataset.t===(S.tab==="battle"?"map":S.tab);b.setAttribute("aria-pressed",String(on));b.className="btn "+(on?"b-gold":"b-purple")});
  if(!DATA.length)return;
  music(S.tab==="battle"?"boss_fight":"map_theme");

function refresh(){
  renderHUD();const a=document.activeElement;
  if(S.tab==="battle"&&$("#hlist")){renderHallList();renderFightBar();const t=totals(dayItems(curDay())),rem=Math.max(0,GOALS.kcal-t.k);if($("#hpbar")){$("#hpbar").style.width=rem/GOALS.kcal*100+"%";$("#hptxt").textContent=`HP ${fmt(rem)} / ${fmt(GOALS.kcal)}`}}
  else if(S.tab==="pack"&&S.ptab==="search"&&$("#plist"))renderPackSearch();
  else if(!(a&&a.tagName==="INPUT"))render();
  if(S.dayOpen&&$("#overlay .sheet"))openDay(S.dayOpen)}

document.addEventListener("click",ev=>{
  const el=ev.target.closest("[data-act]");if(!el)return;
  if(el.classList.contains("sheet")&&ev.target!==el)return;
  const a=el.dataset.act,d=el.dataset;
  if(a==="tab"){S.tab=d.t;S.fight=[];window.scrollTo(0,0);render()}
  else if(a==="hall"){S.hall=d.h;S.meal=null;S.q="";S.fight=[];S.tab="battle";window.scrollTo(0,0);render()}
  else if(a==="meal"){S.meal=d.m;S.q="";render()}
  else if(a==="eat"){const it=lookup(d.k);if(!it)return;const dmg=eat(it,1);
    if(S.tab==="battle"){S.fight.push({...it,q:1});popDmg(el,dmg);setTimeout(()=>sfx("sfx_hit"),130);attackFx(dmg);setTimeout(refresh,560)}else{sfx("sfx_coin");toast(`+${fmt(dmg)} DMG · ${it.n}`);refresh()}
    setTimeout(maybeVictory,900)}
  else if(a==="combo"){let tot=0;d.ks.split("||").forEach(k=>{const it=lookup(k);if(it){tot+=eat(it,1);if(S.tab==="battle")S.fight.push({...it,q:1})}});
    if(S.tab==="battle"){setTimeout(()=>sfx("sfx_hit"),130);attackFx(tot);setTimeout(()=>{renderBattle()},700)}else{toast(`Combo! +${fmt(tot)} DMG`);render()}setTimeout(maybeVictory,900)}
  else if(a==="fav"){toggleFav(d.k);const on=FAVES.includes(d.k);el.classList.toggle("on",on);el.setAttribute("aria-pressed",String(on));if(S.tab==="pack"&&S.ptab==="faves")render()}
  else if(a==="ptab"){S.ptab=d.t;S.adding=false;render()}
  else if(a==="sel"){S.sel=+d.i;S.adding=false;render()}
  else if(a==="newitem"){S.adding=true;S.sel=null;render();setTimeout(()=>{const f=$("#f-n");if(f){f.focus();f.scrollIntoView({block:"center"})}},50)}
  else if(a==="canceladd"){S.adding=false;render()}
  else if(a==="use"){const c=CUSTOM[S.sel];if(!c)return;sfx("sfx_coin");const dmg=eat(fromCustom(c),+d.q);toast(`+${fmt(dmg)} DMG · ${c.n}`);refresh();setTimeout(maybeVictory,600)}
  else if(a==="delitem"){CUSTOM.splice(S.sel,1);S.sel=null;persistMeta("foods");render()}
  else if(a==="day"){openDay(d.d)}
  else if(a==="qty"){setQty(d.d,d.k,+d.dq);if($("#overlay .sheet"))openDay(d.d);renderHUD();if(S.tab==="trophies")renderTrophies();else if(S.tab==="map"){const y=window.scrollY;renderMap();window.scrollTo(0,y)}}
  else if(a==="logto"){S.logDay=d.d===dayId()?null:d.d;S.dayOpen=null;$("#overlay").innerHTML="";S.tab="pack";S.ptab="search";render()}
  else if(a==="logtoday"){S.logDay=null;render()}
  else if(a==="month"){S.month=new Date(S.month.getFullYear(),S.month.getMonth()+(+d.dir),1);renderTrophies()}
  else if(a==="goals"){openGoals()}
  else if(a==="sound"){toggleSound()}
  else if(a==="closesheet"){S.dayOpen=null;$("#overlay").innerHTML=""}
  else if(a==="closevictory"){$("#overlay").innerHTML="";S.tab="trophies";render()}
});
document.addEventListener("input",ev=>{if(ev.target.id==="hq"){S.q=ev.target.value;renderHallList()}else if(ev.target.id==="pq"){S.pq=ev.target.value;renderPackSearch()}});
document.addEventListener("submit",ev=>{ev.preventDefault();
  if(ev.target.id==="addf"){const v=id=>{const x=parseFloat($(id).value);return isNaN(x)?null:x};const n=$("#f-n").value.trim();
    if(!n){$("#f-err").textContent="Add a name.";return}if(v("#f-k")==null){$("#f-err").textContent="Add calories.";return}
    CUSTOM.push({n,s:$("#f-s").value.trim()||"1 serving",k:v("#f-k"),p:v("#f-p")||0,c:v("#f-c")||0,f:v("#f-f")||0,su:v("#f-su"),fi:v("#f-fi"),sf:v("#f-sf"),na:v("#f-na")});
    persistMeta("foods");S.adding=false;S.sel=CUSTOM.length-1;render();toast("Saved to backpack")}
  else if(ev.target.id==="goalf"){const n=id=>{const x=parseFloat($(id).value);return isNaN(x)?null:x};
    GOALS={kcal:n("#g-k")??G0.kcal,protein:n("#g-p")??G0.protein,sugar:n("#g-su")??G0.sugar,sodium:n("#g-na")??G0.sodium};persistMeta("goals");$("#overlay").innerHTML="";render();toast("Goals saved")}});

loadLocal();render();
Promise.all([fetch("menu.json").then(r=>r.json()),fetch("spr.json").then(r=>r.json())]).then(([d,sp])=>{
  SPR=sp;LOCS=d.locs;ST=d.st;DATES=d.dates;TIDX=DATES.indexOf(menuKey());
  HALLS.cc.locs=CC_NAMES.map(n=>LOCS.indexOf(n)).filter(i=>i>=0);
  DATA=d.rows.map(r=>{r._l=String(r[6]).split(",").map(Number);r._n=r[0].toLowerCase();r._k=r._n+"|"+String(r[1]).toLowerCase();r._s=r._n+" "+(ST[r[8]]||"").toLowerCase()+" "+r._l.map(i=>LOCS[i]).join(" ").toLowerCase();return r});
  BYK=new Map(DATA.map(r=>[r._k,r]));render()}).catch(()=>{$("#view").innerHTML=`<p class="hint" style="margin-top:20px">Couldn't load the menus. Reload to try again.</p>`});

(async()=>{let db=null;try{db=await window.claude?.use?.("db")}catch(e){}if(!db)return;
  const W={};pushDoc=(path,body)=>{const st=W[path]||(W[path]={busy:false,pend:null});st.pend=JSON.parse(JSON.stringify(body));if(st.busy)return;st.busy=true;
    (async()=>{while(st.pend){const b=st.pend;st.pend=null;try{await db.doc(path).set(b)}catch(e){if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,800));try{await db.doc(path).set(b)}catch(e2){}}}}st.busy=false})()};
  const clone=x=>JSON.parse(JSON.stringify(x));let synced=false;
  db.collection("days").onSnapshot(s=>{const server=!s.metadata.fromCache;const nd={};s.docs.forEach(doc=>{nd[doc.id]=clone(doc.data())});
    if(server&&!synced){for(const id of Object.keys(DAYS))if(!nd[id]&&DAYS[id].items&&DAYS[id].items.length)persistDay(id)}
    DAYS={...DAYS,...nd};if(server)synced=true;saveLocal();refresh()},()=>{});
  const meta=(name,apply,has)=>db.doc("meta/"+name).onSnapshot(s=>{if(s.exists)apply(clone(s.data()));else if(!s.metadata.fromCache&&has())persistMeta(name);saveLocal();refresh()},()=>{});
  meta("foods",d=>{if(Array.isArray(d.items))CUSTOM=d.items},()=>CUSTOM.length>0);
  meta("goals",d=>{GOALS={...G0,...d}},()=>false);
  meta("faves",d=>{if(Array.isArray(d.keys))FAVES=d.keys},()=>FAVES.length>0);
})();
